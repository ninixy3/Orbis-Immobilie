<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaeliX Immobilien & Weltkarte</title>
    <style>
        /* Deine bestehenden Styles bleiben komplett erhalten */
        .add-form { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 15; width: auto; padding: 10px 20px; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- HINTERGRUNDMUSIK PLAYER (direkt aus dem Hauptordner) -->
    <audio id="bgMusic" loop>
        <source src="Archive.mp3" type="audio/mpeg">
        Dein Browser unterstützt das Audio-Element nicht.
    </audio>

    <!-- MUSIK BUTTON (Unten Links) -->
    <div style="position: fixed; bottom: 20px; left: 20px; z-index: 100;">
        <button class="btn btn-sec" onclick="toggleMusic()" id="musicBtn" style="padding: 8px 15px; font-size: 0.8rem; cursor: pointer;">
            🎵 Musik an
        </button>
    </div>

    <!-- SCRIPT FÜR DEN MUSIK-PLAYER -->
    <script>
        const music = document.getElementById('bgMusic');
        music.volume = 0.3; // Lautstärke auf 30%

        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('musicBtn').innerText = "🔊 Musik aus";
            } else {
                music.pause();
                document.getElementById('musicBtn').innerText = "🎵 Musik an";
            }
        }
    </script>

    <!-- MAIN MENU -->
    <div class="menu-container" id="mainMenu">
        <h1>CAELIX</h1>
        <div class="subtitle">Immobilien & Weltkarte</div>
        <div class="user-info" id="userInfo">
            <span id="userEmail"></span>
        </div>
    </div>

</body>
</html>
